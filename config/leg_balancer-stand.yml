# Stand height parameters
stand_height:
  # Hip joint controller parameters
  hip:
    # Gains for the position (i.e. outer) PID controller
    position:
      K: 5.0
      Ti: 0.0
      Td: 0.0
      N: 15.0
      Beta: 1.0
      Tr: null

      # Smoothing time constant (in ms)
      Tf: 80

    # Gains for the velocity (i.e. inner) PID controller
    velocity:
      K: 3.6
      Ti: 0.0
      Td: 0.0
      N: 15.0
      Beta: 1.0
      Tr: null

      # Smoothing time constant (in ms)
      Tf: 80

    # The relative execution rate of the inner to the outer controller
    outer_factor: 10
    
    # Torque limits
    tau_min: -5.0
    tau_max: 5.0
    
    # Programmatic motion speed (in rad/s)
    motion_speed: 0.8

  # Thigh joint controller parameters
  thigh:
    # Gains for the position (i.e. outer) PID controller
    position:
      K: 10.0
      Ti: 0.0
      Td: 0.0
      N: 20.0
      Beta: 1.0
      Tr: null # sqrt(t_i * t_d)

      # Smoothing time constant (in ms)
      Tf: 40

    # Gains for the velocity (i.e. inner) PID controller
    velocity:
      K: 4.2
      Ti: 0.0
      Td: 0.0
      N: 20.0
      Beta: 1.0
      Tr: null # sqrt(t_i * t_d)

      # Smoothing time constant (in ms)
      Tf: 40


    # The relative execution rate of the inner to the outer controller
    outer_factor: 10
    
    # Torque limits
    tau_min: -20.0
    tau_max: 20.0
    
    # Desired motion speed (in rad/s)
    motion_speed: 0.4

  # Calf joint controller parameters
  calf:
    # Gains for the position (i.e. outer) PID controller
    position:
      K: 10.0
      Ti: 0.0
      Td: 0.0
      N: 20.0
      Beta: 1.0
      Tr: 0.05

      # Smoothing time constant (in ms)
      Tf: 30

    # Gains for the velocity (i.e. inner) PID controller
    velocity:
      K: 2.2
      Ti: 0.1
      Td: 0.003
      N: 20.0
      Beta: 1.0
      Tr: null

      # Smoothing time constant (in ms)
      Tf: 30

    # The relative execution rate of the inner to the outer controller
    outer_factor: 10
    
    # Torque limits
    tau_min: -20.0
    tau_max: 20.0
    
    # Programmatic motion speed (in rad/s)
    motion_speed: 0.4

  # Control period in milliseconds
  ms_per_tick: 2
  
  # Joint angle setpoints for sitdown pose
  steps:
    - all: # sit down
        hip: 0.2
        thigh: 1.3
        calf: -2.8
      time: 3.0
      keep: 4.0
    - front: # stand up 
        hip: 0.0
        thigh: 0.7
        calf: -1.57
      back:
        hip: 0.0
        thigh: 0.8
        calf: -1.57
      time: 1.0
      keep: 5.0
    - all: # sit down
        hip: 0.2
        thigh: 1.3
        calf: -2.8
      time: 2.0