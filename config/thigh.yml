# Parameters for the square wave experiment
square_wave:
  # Log file to save measurements and signals in
  logfile: ./square_wave-thigh.csv 
  
  # Gains for the PID controller
  K: 0.68
  Ti: 0.085
  Td: 0.000
  N: 20.0
  Beta: 1.0
  Tr: null # sqrt(t_i * t_d)

  # Velocity setpoint
  dq: 2.0

  # Torque limits
  tau_min: -10.0
  tau_max: 10.0

  # Experiment duration in measurement periods
  periods: 4

  # Timer ticks per period
  ticks_per_period: 400

  # Control period in milliseconds
  ms_per_tick: 2
  
  # The joint to be controlled
  leg: front_right
  joint: thigh
  
  # Initial joint position (set to null to disable)
  initial:
    hip: 0.0
    thigh: 1.6
    calf: -2.7

# Parameters for the sine wave experiment
sine_wave:
  # Log file to save measurements and signals in
  logfile: ./sine_wave-thigh.csv 

  # Gains for the PID controller
  K: 0.68
  Ti: 0.085
  Td: 0.000
  N: 20.0
  Beta: 1.0
  Tr: null # sqrt(t_i * t_d)

  # Velocity factor
  dq_factor: 4.0

  # Torque limits
  tau_min: -10.0
  tau_max: 10.0

  # Experiment duration in measurement periods
  periods: 4

  # Timer ticks per period
  ticks_per_period: 600

  # Control period in milliseconds
  ms_per_tick: 2
  
  # The joint to be controlled
  leg: front_right
  joint: thigh
  
  # Initial joint position (set to null to disable)
  initial:
    hip: 0.0
    thigh: 1.6
    calf: -2.7

# Parameter for the cascaded sine wave experiment
cascaded_sine_wave:
  # Log file to save measurements and signals in
  logfile: ./cascaded_sine_wave-thigh.csv

  # Gains for the position (i.e. outer) PID controller
  position:
    K: 19.0
    Ti: 0.0
    Td: 0.0
    N: 25.0
    Beta: 1.0
    Tr: null # sqrt(t_i * t_d)

  # Gains for the velocity (i.e. inner) PID controller
  velocity:
    K: 0.38
    Ti: 0.086
    Td: 0.000
    N: 20.0
    Beta: 1.0
    Tr: null # sqrt(t_i * t_d)


  # Position limits (bounds of sine curve)
  pos_min: 3.0
  pos_max: 0.0

  # Torque limits
  tau_min: -20.0
  tau_max: 20.0

  # Experiment duration in measurement periods
  periods: 4

  # Timer ticks per period
  ticks_per_period: 1200

  # Control period in milliseconds
  ms_per_tick: 2
  
  # The relative execution rate of the inner to the outer controller
  outer_factor: 10
  
  # The joint to be controlled
  leg: front_right
  joint: thigh

  # Initial joint position (set to null to disable)
  initial:
    hip: 0.0
    thigh: 1.6
    calf: -2.7
  